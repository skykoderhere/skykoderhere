<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>skye | redirecting...</title>
  <script>
    // GitHub Pages 404 router for sub-apps and case-insensitivity
    (function () {
      var pathname = window.location.pathname;
      var clean = pathname.replace(/^\/+|\/+$/g, '');
      var lower = clean.toLowerCase();

      // List of supported sub-apps/routes
      var routes = {
        'pawgram': '/PawGram/'
      };

      if (routes[lower]) {
        var target = routes[lower] + (window.location.search || '') + (window.location.hash || '');
        window.location.replace(target);
        return;
      }

      // Default redirect to home if not found
      window.location.replace('/' + (window.location.search || '') + (window.location.hash || ''));
    })();
  </script>
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Redirecting...</p>
</body>
</html>
